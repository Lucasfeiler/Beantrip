# Rebuilds the site so newly added shops and cities get prerendered HTML.
#
# The build regenerates the sitemap and the prerendered pages from the live API,
# so nothing here needs updating when content changes.
#
# Runs every night, and on demand from the Actions tab (Run workflow).
name: Refresh prerendered pages

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: coffeespots-e1460
          channelId: live
